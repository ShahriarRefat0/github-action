name: GitHub Secrets

on:
  workflow_dispatch:

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
    - name: Print the secret value
      run: |
        echo "MY_TOP_SECRET: ${{secrets.MY_TOP_SECRET}}"
        echo "i_am_a_exist: ${{secrets.i_dont_exist}}"

    - name: Print Secret as an enviroment variable
      run: |
        echo "MY_TOP_SECRET: $MY_TOP_SECRET"
      env: 
        AZURE_CREDENTIALS: ${{ secrets.MY_TOP_SECRET }}