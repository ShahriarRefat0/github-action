name: Github Environments

on: 
  workflow_dispatch:

jobs:
  deployment:
    runs-on: ubuntu-latest

    environment:
      name: production #this is the name of the environment, you can also use an environment that you have already created in your repository settings
      url: https://github.com

    steps:
    - name: Print environment details
      run: |
        echo "APP_SECRET: ${{ secrets.APP_SECRET }}"